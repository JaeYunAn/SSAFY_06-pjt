{% extends 'base.html' %}

{% block title %}쓰레드 수정 | ThRead{% endblock title %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h1 class="h3 border-bottom pb-2 mb-3">쓰레드 수정</h1>
      <form action="{% url 'books:thread_update' thread.pk %}" method="POST">
        {% csrf_token %}
        {% include 'partials/form_fields.html' %}
        <button type="submit" class="btn btn-outline-success btn-sm">전송</button>
        <a class="btn btn-outline-danger btn-sm" href="{% url 'books:thread_detail' thread.pk %}">취소</a>
      </form>
    </div>
  </div>
{% endblock content %}
