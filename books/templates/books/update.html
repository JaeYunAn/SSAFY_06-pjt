{% extends 'base.html' %}

{% block title %}도서 수정 | ThRead{% endblock title %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h1 class="h3 mb-3">도서 수정 페이지</h1>
      <form action="{% url 'books:update' book.pk %}" method="POST">
        {% csrf_token %}
        {% include 'partials/form_fields.html' %}
        <button type="submit" class="btn btn-primary">제출</button>
        <a class="btn btn-outline-secondary" href="{% url 'books:detail' book.pk %}">취소</a>
      </form>
    </div>
  </div>
{% endblock content %}
