{% extends 'base.html' %}

{% block content %}
  <h1 class="h3 mb-3">메인 페이지</h1>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
    {% for book in books %}
      <div class="col">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <h2 class="card-title h6 fw-bold">{{ book.title }}</h2>
            <p class="card-text small">{{ book.description|truncatechars:200 }}</p>
            <a class="btn btn-primary btn-sm mt-auto align-self-start" href="{% url 'books:detail' book.pk %}">Detail</a>
          </div>
        </div>
      </div>
    {% empty %}
      <p class="text-body-secondary">등록된 도서가 없습니다.</p>
    {% endfor %}
  </div>
{% endblock content %}
