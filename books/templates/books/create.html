{% extends 'base.html' %}

{% block title %}도서 등록 | ThRead{% endblock title %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <h1 class="h3 mb-3">도서 등록 페이지</h1>
      <form action="{% url 'books:create' %}" method="POST">
        {% csrf_token %}
        {% include 'partials/form_fields.html' %}

      </form>
    </div>
  </div>
{% endblock content %}
