<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ThRead{% endblock title %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-success mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'books:index' %}">ThRead</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="메뉴 열기">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-md-center">
          <li class="nav-item"><a class="nav-link" href="{% url 'books:index' %}">INDEX</a></li>
          {% if request.user.is_authenticated %}
            <li class="nav-item"><a class="nav-link" href="{% url 'books:create' %}">CREATE</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'accounts:profile' request.user.username %}">MY PROFILE</a></li>
            <li class="nav-item">
              <form action="{% url 'accounts:logout' %}" method="POST" class="m-0">
                {% csrf_token %}
                <button type="submit" class="nav-link">LOGOUT</button>
              </form>
            </li>
          {% else %}
            <li class="nav-item"><a class="nav-link" href="{% url 'accounts:login' %}">LOGIN</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'accounts:signup' %}">SIGNUP</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">{{ message }}</div>
    {% endfor %}

    {% block content %}
    {% endblock content %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // AI 호출로 응답이 늦어지는 폼의 중복 제출을 막는다.
    document.querySelectorAll('form[data-loading-text]').forEach((form) => {
      form.addEventListener('submit', () => {
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = form.dataset.loadingText;
      });
    });
  </script>
</body>
</html>
